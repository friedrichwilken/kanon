[package]
name = "kanon"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Measure a retriever against a corpus, and keep measuring it as both change"
readme = "README.md"
keywords = ["retrieval", "evaluation", "rag", "recall"]
categories = ["command-line-utilities"]

[lib]
name = "kanon"
path = "src/lib.rs"

[[bin]]
name = "kanon"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
pinakes = { git = "https://github.com/friedrichwilken/pinakes", rev = "3f9be6dae368bb0dcb0574e36664cc35f2ba01a6" }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
tantivy = "0.26.2"
thiserror = "2.0.20"
ureq = { version = "3.4.2", features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
